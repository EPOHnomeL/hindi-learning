  <h1>ज्योति — “the Light”</h1>
  <p class="verse">“मैं जगत की <strong>ज्योति</strong> हूँ।” <span class="cite">— यूहन्ना 8:12 (John 8:12)</span></p>
  <p>The word <span class="dev">ज्योति</span> <em>(jyoti)</em> means <strong>light</strong>. Hear the bright “j”: <em>JYO-tee</em>.</p>
  <p class="aside">📖 Pair it with last lesson — शान्ति and ज्योति, peace and light.</p>
